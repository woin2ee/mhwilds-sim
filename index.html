<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: 아이폰 노치·홈 표시줄 영역까지 쓰고 여백은 env(safe-area-inset-*) 로 직접 둔다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 방어력·공유 코드의 숫자를 iOS 가 전화번호 링크로 바꾸지 않게 -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="몬스터 헌터 와일즈 비공식 방어구 세팅 시뮬레이터 — 원하는 스킬·내성으로 세팅 검색" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>와일즈 스킬 시뮬레이터 (비공식)</title>
    <script>
      // 첫 화면이 그려지기 전에 테마를 적용해 깜빡임을 막는다. 저장 키·규칙은 src/lib/theme.ts 와 같게 유지한다.
      {
        let theme = null
        try {
          theme = JSON.parse(localStorage.getItem('mhwilds-sim:theme:v1'))
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
